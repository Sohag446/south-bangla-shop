<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#333b48"/>
      <stop offset="25%" stop-color="#242b35"/>
      <stop offset="100%" stop-color="#181c23"/>
    </linearGradient>
    <linearGradient id="topPanelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#414b5c"/>
      <stop offset="100%" stop-color="#2b3340"/>
    </linearGradient>
    <linearGradient id="portGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14181f"/>
      <stop offset="100%" stop-color="#090c10"/>
    </linearGradient>
    <filter id="rackShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#001830" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="500" height="400" fill="#f8fafc" rx="16"/>

  <!-- Shadow under rack chassis -->
  <ellipse cx="250" cy="310" rx="205" ry="20" fill="#001830" opacity="0.14" filter="blur(5px)"/>

  <!-- Rack Chassis Group (Perspective Angle) -->
  <g filter="url(#rackShadow)">
    <!-- Top Face (Perspective) -->
    <polygon points="65,190 435,190 455,215 45,215" fill="url(#topPanelGrad)"/>
    <line x1="65" y1="190" x2="435" y2="190" stroke="#546277" stroke-width="1.5"/>

    <!-- Left & Right Rack Ears (19-inch standard rack mounts) -->
    <!-- Left Rack Ear -->
    <polygon points="30,215 45,215 45,275 30,275" fill="#202630" stroke="#485567" stroke-width="1"/>
    <circle cx="37" cy="227" r="3.5" fill="#12151b" stroke="#718096" stroke-width="1"/>
    <circle cx="37" cy="263" r="3.5" fill="#12151b" stroke="#718096" stroke-width="1"/>

    <!-- Right Rack Ear -->
    <polygon points="455,215 470,215 470,275 455,275" fill="#202630" stroke="#485567" stroke-width="1"/>
    <circle cx="463" cy="227" r="3.5" fill="#12151b" stroke="#718096" stroke-width="1"/>
    <circle cx="463" cy="263" r="3.5" fill="#12151b" stroke="#718096" stroke-width="1"/>

    <!-- Front Panel Face -->
    <rect x="45" y="215" width="410" height="60" rx="3" fill="url(#chassisGrad)" stroke="#1a202c" stroke-width="1.5"/>
    <line x1="45" y1="216" x2="455" y2="216" stroke="#5a687d" stroke-width="1"/>
    <line x1="45" y1="274" x2="455" y2="274" stroke="#0e1218" stroke-width="1"/>

    <!-- Brand Emblem Left Area -->
    <g transform="translate(60, 230)">
      <text x="0" y="14" font-family="'Poppins', system-ui, sans-serif" font-size="14" font-weight="900" letter-spacing="2" fill="#ffffff">MISSION</text>
      <text x="0" y="27" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600" letter-spacing="1" fill="#72BF44">MS-2400-24P</text>
      <text x="0" y="37" font-family="system-ui, sans-serif" font-size="6.5" fill="#94a3b8">24G + 2SFP PoE+ Switch</text>
    </g>

    <!-- System LED Cluster -->
    <g transform="translate(155, 226)">
      <circle cx="0" cy="8" r="2" fill="#72BF44"/>
      <text x="5" y="10" font-family="system-ui, sans-serif" font-size="5.5" fill="#94a3b8">PWR</text>
      <circle cx="0" cy="20" r="2" fill="#72BF44"/>
      <text x="5" y="22" font-family="system-ui, sans-serif" font-size="5.5" fill="#94a3b8">SYS</text>
      <circle cx="0" cy="32" r="2" fill="#007ab5"/>
      <text x="5" y="34" font-family="system-ui, sans-serif" font-size="5.5" fill="#94a3b8">PoE</text>
    </g>

    <!-- RJ45 Gigabit PoE+ Port Blocks (12 Ports Top + 12 Ports Bottom) -->
    <g transform="translate(190, 226)">
      <!-- Top Row Ports 1-12 -->
      <g>
        <!-- Port 1-4 -->
        <rect x="0" y="2" width="46" height="18" rx="2" fill="url(#portGrad)" stroke="#374151" stroke-width="0.8"/>
        <!-- Port 5-8 -->
        <rect x="52" y="2" width="46" height="18" rx="2" fill="url(#portGrad)" stroke="#374151" stroke-width="0.8"/>
        <!-- Port 9-12 -->
        <rect x="104" y="2" width="46" height="18" rx="2" fill="url(#portGrad)" stroke="#374151" stroke-width="0.8"/>
      </g>
      <!-- Bottom Row Ports 13-24 -->
      <g>
        <!-- Port 13-16 -->
        <rect x="0" y="23" width="46" height="18" rx="2" fill="url(#portGrad)" stroke="#374151" stroke-width="0.8"/>
        <!-- Port 17-20 -->
        <rect x="52" y="23" width="46" height="18" rx="2" fill="url(#portGrad)" stroke="#374151" stroke-width="0.8"/>
        <!-- Port 21-24 -->
        <rect x="104" y="23" width="46" height="18" rx="2" fill="url(#portGrad)" stroke="#374151" stroke-width="0.8"/>
      </g>

      <!-- Port Indicator LEDs (Green & Amber) -->
      <!-- Top indicators -->
      <circle cx="6" cy="0" r="1.2" fill="#72BF44"/>
      <circle cx="17" cy="0" r="1.2" fill="#72BF44"/>
      <circle cx="28" cy="0" r="1.2" fill="#72BF44"/>
      <circle cx="39" cy="0" r="1.2" fill="#72BF44"/>

      <circle cx="58" cy="0" r="1.2" fill="#72BF44"/>
      <circle cx="69" cy="0" r="1.2" fill="#72BF44"/>
      <circle cx="80" cy="0" r="1.2" fill="#72BF44"/>
      <circle cx="91" cy="0" r="1.2" fill="#72BF44"/>

      <circle cx="110" cy="0" r="1.2" fill="#72BF44"/>
      <circle cx="121" cy="0" r="1.2" fill="#72BF44"/>
      <circle cx="132" cy="0" r="1.2" fill="#72BF44"/>
      <circle cx="143" cy="0" r="1.2" fill="#72BF44"/>
    </g>

    <!-- SFP Optical Uplink Ports (Ports 25, 26) -->
    <g transform="translate(365, 226)">
      <!-- SFP Cage 1 -->
      <rect x="0" y="8" width="28" height="28" rx="2" fill="#1a202c" stroke="#4a5568" stroke-width="1"/>
      <rect x="4" y="12" width="20" height="20" fill="#0b0f15" stroke="#72BF44" stroke-width="0.8"/>
      <!-- SFP Cage 2 -->
      <rect x="36" y="8" width="28" height="28" rx="2" fill="#1a202c" stroke="#4a5568" stroke-width="1"/>
      <rect x="40" y="12" width="20" height="20" fill="#0b0f15" stroke="#007ab5" stroke-width="0.8"/>
      <!-- SFP LEDs -->
      <circle cx="14" cy="4" r="1.5" fill="#72BF44"/>
      <circle cx="50" cy="4" r="1.5" fill="#007ab5"/>
      <text x="14" y="0" text-anchor="middle" font-family="system-ui" font-size="5" fill="#94a3b8">25F</text>
      <text x="50" y="0" text-anchor="middle" font-family="system-ui" font-size="5" fill="#94a3b8">26F</text>
    </g>
  </g>

  <!-- Spec Tag -->
  <rect x="165" y="348" width="170" height="24" rx="12" fill="#edf7e8" stroke="#c2e6b0" stroke-width="1"/>
  <text x="250" y="364" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" fill="#2d6a1b">370W PoE+ Budget · L2 Smart</text>
</svg>
