<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account Settings | South Bangla Computers</title>
  <meta name="description" content="Update your personal details, change account password, and manage communication preferences.">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/print.css" media="print">
  <style>
    .account-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: var(--sp-8);
      align-items: start;
    }
    @media (max-width: 900px) {
      .account-layout {
        grid-template-columns: 1fr;
      }
    }
    .account-nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--r-md);
      color: var(--navy-800);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: background var(--trans-fast);
    }
    .account-nav-link:hover {
      background: var(--gray-100);
    }
    .account-nav-link.is-active {
      background: #EFF6FF;
      color: var(--blue-700);
      font-weight: 700;
    }
  </style>
</head>
<body data-root="../" data-page="account">
  <div id="sbc-header"></div>

  <main id="main-content" class="l-container" style="padding-top: var(--sp-6); padding-bottom: var(--sp-12);">
    <!-- Breadcrumbs -->
    <nav aria-label="Breadcrumb" class="sbc-breadcrumbs" style="margin-bottom: var(--sp-6);">
      <ol style="display:flex;gap:var(--sp-2);list-style:none;padding:0;margin:0;font-size:var(--fs-xs);color:var(--c-text-muted);">
        <li><a href="../index.html">Home</a> <span aria-hidden="true">&rsaquo;</span></li>
        <li><a href="index.html">My Account</a> <span aria-hidden="true">&rsaquo;</span></li>
        <li style="color:var(--navy-900);font-weight:600;" aria-current="page">Account Settings</li>
      </ol>
    </nav>

    <div class="account-layout">
      <!-- Account Sidebar Nav -->
      <aside style="background:#fff;border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:var(--sp-4);">
        <div style="padding:12px;border-bottom:1px solid var(--gray-200);margin-bottom:8px;">
          <strong id="acc-nav-name" style="display:block;font-size:15px;color:var(--navy-900);">Customer Account</strong>
          <span id="acc-nav-email" style="font-size:12px;color:var(--c-text-muted);">customer@demo.sbc</span>
        </div>
        <nav style="display:flex;flex-direction:column;gap:4px;">
          <a href="index.html" class="account-nav-link">Overview Dashboard</a>
          <a href="orders.html" class="account-nav-link">Order History</a>
          <a href="addresses.html" class="account-nav-link">Delivery Addresses</a>
          <a href="settings.html" class="account-nav-link is-active">Account Settings</a>
          <a href="../wishlist.html" class="account-nav-link">My Wishlist</a>
          <div style="border-top:1px solid var(--gray-200);margin:8px 0;"></div>
          <a href="#" class="account-nav-link js-logout" style="color:var(--red-700);">Sign Out</a>
        </nav>
      </aside>

      <!-- Settings Content -->
      <section style="display:flex;flex-direction:column;gap:var(--sp-6);">
        <div>
          <h1 style="font-size:var(--fs-h2);color:var(--navy-900);margin:0 0 4px;">Account Settings & Security</h1>
          <p style="color:var(--c-text-muted);font-size:var(--fs-sm);margin:0;">Update personal profile and change account password</p>
        </div>

        <!-- Profile Card -->
        <div style="background:#fff;border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:var(--sp-6);">
          <h3 style="font-size:var(--fs-h4);color:var(--navy-900);margin:0 0 16px;">Personal Information</h3>
          <form id="profile-form" novalidate>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4);margin-bottom:var(--sp-4);">
              <div class="sbc-form-group">
                <label for="set-name" class="sbc-label sbc-label--required">Full Name:</label>
                <input type="text" id="set-name" class="sbc-input" required value="Kamrul Hasan">
              </div>
              <div class="sbc-form-group">
                <label for="set-email" class="sbc-label sbc-label--required">Email Address:</label>
                <input type="email" id="set-email" class="sbc-input" required value="customer@demo.sbc">
              </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4);margin-bottom:var(--sp-4);">
              <div class="sbc-form-group">
                <label for="set-phone" class="sbc-label sbc-label--required">Mobile Number:</label>
                <input type="tel" id="set-phone" class="sbc-input" required value="01711002233">
              </div>
              <div class="sbc-form-group">
                <label for="set-branch" class="sbc-label">Preferred SBC Branch for Pickups:</label>
                <select id="set-branch" class="sbc-select">
                  <option value="Head Office (Computer City Center, Dhaka)">Head Office (Computer City Center, Dhaka)</option>
                  <option value="IDB Bhaban Branch, Dhaka">IDB Bhaban Branch, Dhaka</option>
                  <option value="Chattogram Agrabad Branch">Chattogram Agrabad Branch</option>
                  <option value="Khulna Jalil Tower Branch">Khulna Jalil Tower Branch</option>
                </select>
              </div>
            </div>
            <button type="submit" class="sbc-btn sbc-btn--primary sbc-btn--sm">Save Profile Changes</button>
          </form>
        </div>

        <!-- Password Card -->
        <div style="background:#fff;border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:var(--sp-6);">
          <h3 style="font-size:var(--fs-h4);color:var(--navy-900);margin:0 0 16px;">Change Password</h3>
          <form id="password-form" novalidate>
            <div class="sbc-form-group">
              <label for="pwd-curr" class="sbc-label sbc-label--required">Current Password:</label>
              <input type="password" id="pwd-curr" class="sbc-input" placeholder="••••••••" style="max-width:320px;">
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4);margin-bottom:var(--sp-4);">
              <div class="sbc-form-group">
                <label for="pwd-new" class="sbc-label sbc-label--required">New Password:</label>
                <input type="password" id="pwd-new" class="sbc-input" placeholder="At least 8 characters">
              </div>
              <div class="sbc-form-group">
                <label for="pwd-confirm" class="sbc-label sbc-label--required">Confirm New Password:</label>
                <input type="password" id="pwd-confirm" class="sbc-input" placeholder="Repeat new password">
              </div>
            </div>
            <button type="submit" class="sbc-btn sbc-btn--outline sbc-btn--sm">Update Password</button>
          </form>
        </div>
      </section>
    </div>
  </main>

  <div id="sbc-footer"></div>
  <div id="sbc-toast" role="status" aria-live="polite"></div>

  <!-- Standard Prototype Scripts -->
  <script defer src="../js/config.js"></script>
  <script defer src="../js/i18n/bn.js"></script>
  <script defer src="../js/i18n/en.js"></script>
  <script defer src="../js/core/util.js"></script>
  <script defer src="../js/core/storage.js"></script>
  <script defer src="../data/categories.js"></script>
  <script defer src="../data/brands.js"></script>
  <script defer src="../data/branches.js"></script>
  <script defer src="../data/news.js"></script>
  <script defer src="../data/faq.js"></script>
  <script defer src="../data/downloads.js"></script>
  <script defer src="../data/districts.js"></script>
  <script defer src="../data/configurator-rules.js"></script>
  <script defer src="../data/site-claims.js"></script>
  <script defer src="../data/users.js"></script>
  <script defer src="../data/products.js"></script>
  <script defer src="../js/core/store.js"></script>
  <script defer src="../js/core/validate.js"></script>
  <script defer src="../js/core/ui.js"></script>
  <script defer src="../js/layout.js"></script>
  <script defer src="../js/search.js"></script>
  <script defer src="../js/cards.js"></script>
  <script defer src="../js/account.js"></script>
  <script defer src="../js/demo.js"></script>

  <script defer>
    window.addEventListener("SBC:ready", function () {
      const store = window.SBC.store;
      const ui = window.SBC.ui;
      const session = store.getSession();

      if (session) {
        document.getElementById("acc-nav-name").textContent = session.name;
        document.getElementById("acc-nav-email").textContent = session.email;
        document.getElementById("set-name").value = session.name;
        document.getElementById("set-email").value = session.email;
        if (session.phone) document.getElementById("set-phone").value = session.phone;
      }

      document.getElementById("profile-form").addEventListener("submit", function (e) {
        e.preventDefault();
        const updatedName = document.getElementById("set-name").value.trim();
        const updatedEmail = document.getElementById("set-email").value.trim();
        const updatedPhone = document.getElementById("set-phone").value.trim();

        if (session) {
          session.name = updatedName;
          session.email = updatedEmail;
          session.phone = updatedPhone;
          store.setSession(session);
        }
        ui.toast("Profile changes saved successfully", "success");
      });

      document.getElementById("password-form").addEventListener("submit", function (e) {
        e.preventDefault();
        const n = document.getElementById("pwd-new").value;
        const c = document.getElementById("pwd-confirm").value;

        if (n.length < 8) {
          ui.toast("New password must be at least 8 characters", "warning");
          return;
        }
        if (n !== c) {
          ui.toast("New passwords do not match", "warning");
          return;
        }
        ui.toast("Password updated successfully!", "success");
        document.getElementById("password-form").reset();
      });
    });
  </script>
</body>
</html>
