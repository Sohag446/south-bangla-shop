<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saved Delivery Addresses | South Bangla Computers</title>
  <meta name="description" content="Manage your saved shipping and billing addresses for fast checkout across Bangladesh.">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/print.css" media="print">
  <style>
    .account-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: var(--sp-8);
      align-items: start;
    }
    @media (max-width: 900px) {
      .account-layout {
        grid-template-columns: 1fr;
      }
    }
    .account-nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--r-md);
      color: var(--navy-800);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: background var(--trans-fast);
    }
    .account-nav-link:hover {
      background: var(--gray-100);
    }
    .account-nav-link.is-active {
      background: #EFF6FF;
      color: var(--blue-700);
      font-weight: 700;
    }
  </style>
</head>
<body data-root="../" data-page="account">
  <div id="sbc-header"></div>

  <main id="main-content" class="l-container" style="padding-top: var(--sp-6); padding-bottom: var(--sp-12);">
    <!-- Breadcrumbs -->
    <nav aria-label="Breadcrumb" class="sbc-breadcrumbs" style="margin-bottom: var(--sp-6);">
      <ol style="display:flex;gap:var(--sp-2);list-style:none;padding:0;margin:0;font-size:var(--fs-xs);color:var(--c-text-muted);">
        <li><a href="../index.html">Home</a> <span aria-hidden="true">&rsaquo;</span></li>
        <li><a href="index.html">My Account</a> <span aria-hidden="true">&rsaquo;</span></li>
        <li style="color:var(--navy-900);font-weight:600;" aria-current="page">Addresses</li>
      </ol>
    </nav>

    <div class="account-layout">
      <!-- Account Sidebar Nav -->
      <aside style="background:#fff;border:1px solid var(--gray-200);border-radius:var(--r-lg);padding:var(--sp-4);">
        <div style="padding:12px;border-bottom:1px solid var(--gray-200);margin-bottom:8px;">
          <strong id="acc-nav-name" style="display:block;font-size:15px;color:var(--navy-900);">Customer Account</strong>
          <span id="acc-nav-email" style="font-size:12px;color:var(--c-text-muted);">customer@demo.sbc</span>
        </div>
        <nav style="display:flex;flex-direction:column;gap:4px;">
          <a href="index.html" class="account-nav-link">Overview Dashboard</a>
          <a href="orders.html" class="account-nav-link">Order History</a>
          <a href="addresses.html" class="account-nav-link is-active">Delivery Addresses</a>
          <a href="settings.html" class="account-nav-link">Account Settings</a>
          <a href="../wishlist.html" class="account-nav-link">My Wishlist</a>
          <div style="border-top:1px solid var(--gray-200);margin:8px 0;"></div>
          <a href="#" class="account-nav-link js-logout" style="color:var(--red-700);">Sign Out</a>
        </nav>
      </aside>

      <!-- Addresses Content Area -->
      <section>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-6);">
          <div>
            <h1 style="font-size:var(--fs-h2);color:var(--navy-900);margin:0 0 4px;">Saved Delivery Addresses</h1>
            <p style="color:var(--c-text-muted);font-size:var(--fs-sm);margin:0;">Manage destination addresses for fast courier delivery</p>
          </div>
          <button class="sbc-btn sbc-btn--primary sbc-btn--sm js-add-address-btn">+ Add New Address</button>
        </div>

        <div id="addresses-grid" style="display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:var(--sp-4);">
          <!-- Rendered via JS -->
        </div>
      </section>
    </div>
  </main>

  <div id="sbc-footer"></div>
  <div id="sbc-toast" role="status" aria-live="polite"></div>

  <!-- Standard Prototype Scripts -->
  <script defer src="../js/config.js"></script>
  <script defer src="../js/i18n/bn.js"></script>
  <script defer src="../js/i18n/en.js"></script>
  <script defer src="../js/core/util.js"></script>
  <script defer src="../js/core/storage.js"></script>
  <script defer src="../data/categories.js"></script>
  <script defer src="../data/brands.js"></script>
  <script defer src="../data/branches.js"></script>
  <script defer src="../data/news.js"></script>
  <script defer src="../data/faq.js"></script>
  <script defer src="../data/downloads.js"></script>
  <script defer src="../data/districts.js"></script>
  <script defer src="../data/configurator-rules.js"></script>
  <script defer src="../data/site-claims.js"></script>
  <script defer src="../data/users.js"></script>
  <script defer src="../data/products.js"></script>
  <script defer src="../js/core/store.js"></script>
  <script defer src="../js/core/validate.js"></script>
  <script defer src="../js/core/ui.js"></script>
  <script defer src="../js/layout.js"></script>
  <script defer src="../js/search.js"></script>
  <script defer src="../js/cards.js"></script>
  <script defer src="../js/account.js"></script>
  <script defer src="../js/demo.js"></script>

  <script defer>
    window.addEventListener("SBC:ready", function () {
      const util = window.SBC.util;
      const store = window.SBC.store;
      const storage = window.SBC.storage;
      const ui = window.SBC.ui;
      const session = store.getSession();

      if (session) {
        document.getElementById("acc-nav-name").textContent = session.name;
        document.getElementById("acc-nav-email").textContent = session.email;
      }

      let addresses = storage.get("savedAddresses", [
        {
          id: "addr-1",
          label: "Primary Office / Headquarters",
          name: session ? session.name : "Kamrul Hasan",
          phone: "01711002233",
          district: "Dhaka",
          address: "House 24, Road 7, Sector 4, Uttara, Dhaka-1230",
          isDefault: true
        },
        {
          id: "addr-2",
          label: "Branch Warehouse",
          name: "Warehouse Manager",
          phone: "01973009007",
          district: "Chattogram",
          address: "Agrabad Commercial Area, Chattogram",
          isDefault: false
        }
      ]);

      function saveAddresses() {
        storage.set("savedAddresses", addresses);
      }

      function renderGrid() {
        const grid = document.getElementById("addresses-grid");
        grid.innerHTML = addresses.map(addr => `
          <div class="sbc-card" style="padding:16px;display:flex;flex-direction:column;border:${addr.isDefault ? '2px solid var(--blue-600)' : '1px solid var(--gray-200)'};">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
              <span class="sbc-badge ${addr.isDefault ? 'sbc-badge--tag' : ''}">${util.esc(addr.label)}</span>
              ${addr.isDefault ? '<span style="font-size:11px;color:var(--blue-700);font-weight:700;">DEFAULT</span>' : ''}
            </div>
            <strong style="font-size:14px;color:var(--navy-900);margin-bottom:2px;">${util.esc(addr.name)}</strong>
            <div style="font-size:12px;color:var(--c-text-muted);margin-bottom:8px;">${util.esc(addr.phone)} &bull; District: <strong>${util.esc(addr.district)}</strong></div>
            <p style="font-size:13px;color:var(--c-text-secondary);margin:0 0 16px;flex:1;line-height:1.4;">
              ${util.esc(addr.address)}
            </p>
            <div style="display:flex;gap:8px;border-top:1px solid var(--gray-200);padding-top:12px;">
              ${!addr.isDefault ? `<button class="sbc-btn sbc-btn--ghost sbc-btn--sm js-make-default" data-id="${addr.id}">Set Default</button>` : ''}
              <button class="sbc-btn sbc-btn--ghost sbc-btn--sm js-del-addr" data-id="${addr.id}" style="color:var(--red-700);margin-left:auto;">Delete</button>
            </div>
          </div>
        `).join("");

        grid.querySelectorAll(".js-make-default").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = btn.dataset.id;
            addresses.forEach(a => a.isDefault = (a.id === id));
            saveAddresses();
            ui.toast("Default delivery address updated", "success");
            renderGrid();
          });
        });

        grid.querySelectorAll(".js-del-addr").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = btn.dataset.id;
            addresses = addresses.filter(a => a.id !== id);
            saveAddresses();
            ui.toast("Address removed", "info");
            renderGrid();
          });
        });
      }

      document.querySelector(".js-add-address-btn").addEventListener("click", () => {
        ui.modal({
          title: "Add New Delivery Address",
          body: `
            <div class="sbc-form-group">
              <label class="sbc-label sbc-label--required">Address Label:</label>
              <input type="text" id="modal-addr-label" class="sbc-input" placeholder="e.g. Home, Branch Office, Server Room" value="Project Site">
            </div>
            <div class="sbc-form-group">
              <label class="sbc-label sbc-label--required">Recipient Name:</label>
              <input type="text" id="modal-addr-name" class="sbc-input" placeholder="e.g. Kamrul Hasan" value="${session ? session.name : ''}">
            </div>
            <div class="sbc-form-group">
              <label class="sbc-label sbc-label--required">Contact Mobile Number:</label>
              <input type="tel" id="modal-addr-phone" class="sbc-input" placeholder="01XXXXXXXXX" value="01711000000">
            </div>
            <div class="sbc-form-group">
              <label class="sbc-label sbc-label--required">District:</label>
              <select id="modal-addr-district" class="sbc-select">
                <option value="Dhaka">Dhaka</option>
                <option value="Chattogram">Chattogram</option>
                <option value="Khulna">Khulna</option>
                <option value="Rajshahi">Rajshahi</option>
                <option value="Sylhet">Sylhet</option>
              </select>
            </div>
            <div class="sbc-form-group">
              <label class="sbc-label sbc-label--required">Street Address & Thana:</label>
              <textarea id="modal-addr-text" class="sbc-textarea" rows="2" placeholder="Building name, road number, area..."></textarea>
            </div>
          `,
          footer: `
            <button class="sbc-btn sbc-btn--primary sbc-btn--full" id="js-save-modal-addr">Save Address &rarr;</button>
          `
        });

        setTimeout(() => {
          document.getElementById("js-save-modal-addr").addEventListener("click", () => {
            const label = document.getElementById("modal-addr-label").value.trim() || "Delivery Location";
            const name = document.getElementById("modal-addr-name").value.trim();
            const phone = document.getElementById("modal-addr-phone").value.trim();
            const district = document.getElementById("modal-addr-district").value;
            const text = document.getElementById("modal-addr-text").value.trim();

            if (!name || !phone || !text) {
              ui.toast("Please fill in recipient, phone, and street address", "warning");
              return;
            }

            addresses.push({
              id: `addr-${Date.now()}`,
              label,
              name,
              phone,
              district,
              address: text,
              isDefault: addresses.length === 0
            });
            saveAddresses();
            ui.closeModal();
            ui.toast("New address added successfully!", "success");
            renderGrid();
          });
        }, 100);
      });

      renderGrid();
    });
  </script>
</body>
</html>
