      </p>

      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;">

        <a href="products.html" class="sbc-btn sbc-btn--outline">Browse Product Catalog</a>
      </div>

      <div style="border-top:1px solid var(--gray-200);padding-top:20px;font-size:13px;color:var(--c-text-secondary);">
        Need immediate assistance? Central Helpline: <strong style="color:var(--navy-900);">01973009007</strong>
      </div>
    </div>
  </main>

  <div id="sbc-footer"></div>
