<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout & Delivery Details | South Bangla Computers</title>
  <meta name="description" content="Simulated checkout for South Bangla Computers prototype with Bangladesh district delivery fee calculation and payment simulation.">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/print.css" media="print">
  <style>
    .checkout-layout {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: var(--sp-8);
      align-items: start;
    }
    @media (max-width: 900px) {
      .checkout-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body data-root="" data-page="checkout">
  <div id="sbc-header"></div>

  <main id="main-content" class="l-container" style="padding-top: var(--sp-6); padding-bottom: var(--sp-12);">
    <!-- Breadcrumbs -->
    <nav aria-label="Breadcrumb" class="sbc-breadcrumbs" style="margin-bottom: var(--sp-6);">
      <ol style="display:flex;gap:var(--sp-2);list-style:none;padding:0;margin:0;font-size:var(--fs-xs);color:var(--c-text-muted);">
        <li><a href="index.html">Home</a> <span aria-hidden="true">&rsaquo;</span></li>
        <li><a href="cart.html">Shopping Cart</a> <span aria-hidden="true">&rsaquo;</span></li>
        <li style="color:var(--navy-900);font-weight:600;" aria-current="page">Simulated Checkout</li>
      </ol>
    </nav>

    <!-- Prototype Simulation Notice -->
    <div style="background:#EFF6FF;border:1px solid #93C5FD;border-radius:var(--r-md);padding:12px 16px;margin-bottom:var(--sp-6);display:flex;align-items:center;gap:12px;">
      <span style="color:var(--blue-600);font-size:18px;">&#9432;</span>
      <p style="margin:0;font-size:13px;color:#1E3A8A;">
        <strong>Prototype Demonstration:</strong> This checkout flow is an interactive simulation. No real financial charges, credit card inputs, or warehouse dispatches occur.
      </p>
    </div>

    <!-- Main 2-Column Checkout -->
    <div class="checkout-layout">
      <!-- Left Column: Checkout Form (Rendered/Managed by js/checkout.js) -->
      <div>
        <form id="checkout-form" novalidate></form>
      </div>

      <!-- Right Column: Order Summary (Rendered/Managed by js/checkout.js) -->
      <div>
        <div id="checkout-summary"></div>
      </div>
    </div>
  </main>

  <div id="sbc-footer"></div>
  <div id="sbc-toast" role="status" aria-live="polite"></div>

  <!-- Standard Prototype Scripts -->
  <script defer src="js/config.js"></script>
  <script defer src="js/i18n/en.js"></script>
  <script defer src="js/core/util.js"></script>
  <script defer src="js/core/storage.js"></script>
  <script defer src="data/categories.js"></script>
  <script defer src="data/brands.js"></script>
  <script defer src="data/branches.js"></script>
  <script defer src="data/news.js"></script>
  <script defer src="data/faq.js"></script>
  <script defer src="data/downloads.js"></script>
  <script defer src="data/districts.js"></script>
  <script defer src="data/configurator-rules.js"></script>
  <script defer src="data/site-claims.js"></script>
  <script defer src="data/users.js"></script>
  <script defer src="data/shop-products.js"></script>
  <script defer src="data/products.js"></script>
  <script defer src="js/core/store.js"></script>
  <script defer src="js/core/validate.js"></script>
  <script defer src="js/core/ui.js"></script>
  <script defer src="js/layout.js"></script>
  <script defer src="js/search.js"></script>
  <script defer src="js/cards.js"></script>
  <script defer src="js/checkout.js"></script>
  <script defer src="js/demo.js"></script>

  <script defer>
    window.addEventListener("SBC:ready", function () {
      const formEl = document.getElementById("checkout-form");
      const summaryEl = document.getElementById("checkout-summary");
      if (window.SBC && window.SBC.checkout) {
        window.SBC.checkout.init(formEl, summaryEl);
      }
    });
  </script>
</body>
</html>
