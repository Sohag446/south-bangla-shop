<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | South Bangla Computers</title>
  <meta name="description" content="Recover your South Bangla Computers account password via SMS OTP or email link.">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body data-root="" data-page="forgot-password">
  <a href="#main-content" class="sbc-skip-link">Skip to main content</a>
  <div id="sbc-header"></div>

  <main id="main-content" class="l-container" style="padding-top: var(--sp-8); padding-bottom: var(--sp-12);">
    <div style="max-width: 440px; margin: 0 auto;">
      <div style="text-align:center; margin-bottom: var(--sp-6);">
        <h1 style="font-size:var(--fs-h2); color:var(--navy-900); margin:0 0 6px;">Reset Password</h1>
        <p style="color:var(--c-text-muted); font-size:var(--fs-sm); margin:0;">
          Enter your registered email address or mobile number to receive a recovery code.
        </p>
      </div>

      <div style="background:#fff; border:1px solid var(--gray-200); border-radius:var(--r-lg); padding:var(--sp-6); box-shadow:var(--sh-sm);" id="forgot-card">
        <form id="forgot-form" novalidate>
          <div class="sbc-form-group">
            <label for="f-ident" class="sbc-label sbc-label--required">Registered Email or Phone:</label>
            <input type="text" id="f-ident" class="sbc-input" required placeholder="name@example.com or 01XXXXXXXXX">
            <span class="sbc-input-error" id="f-ident-err"></span>
          </div>

          <button type="submit" class="sbc-btn sbc-btn--primary sbc-btn--lg sbc-btn--full" style="margin-top:var(--sp-4);">
            Send Verification Code &rarr;
          </button>
        </form>

        <div style="text-align:center; margin-top:var(--sp-6); padding-top:var(--sp-4); border-top:1px solid var(--gray-200); font-size:13px; color:var(--c-text-muted);">
          Remembered your password? <a href="login.html" style="font-weight:600;">Back to login</a>
        </div>
      </div>
    </div>
  </main>

  <div id="sbc-footer"></div>
  <div id="sbc-toast" role="status" aria-live="polite"></div>

  <!-- Standard Prototype Scripts -->
  <script defer src="js/config.js"></script>
  <script defer src="js/i18n/en.js"></script>
  <script defer src="js/core/util.js"></script>
  <script defer src="js/core/storage.js"></script>
  <script defer src="data/categories.js"></script>
  <script defer src="data/brands.js"></script>
  <script defer src="data/branches.js"></script>
  <script defer src="data/news.js"></script>
  <script defer src="data/faq.js"></script>
  <script defer src="data/downloads.js"></script>
  <script defer src="data/districts.js"></script>
  <script defer src="data/configurator-rules.js"></script>
  <script defer src="data/site-claims.js"></script>
  <script defer src="data/users.js"></script>
  <script defer src="data/products.js"></script>
  <script defer src="js/core/store.js"></script>
  <script defer src="js/core/validate.js"></script>
  <script defer src="js/core/ui.js"></script>
  <script defer src="js/layout.js"></script>
  <script defer src="js/search.js"></script>
  <script defer src="js/cards.js"></script>
  <script defer src="js/demo.js"></script>

  <script defer>
    window.addEventListener("SBC:ready", function () {
      const util = window.SBC.util;
      const ui = window.SBC.ui;

      const form = document.getElementById("forgot-form");
      const card = document.getElementById("forgot-card");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        const val = document.getElementById("f-ident").value.trim();

        if (!val) {
          document.getElementById("f-ident-err").textContent = "Please enter your email or phone number";
          return;
        }

        card.innerHTML = `
          <div style="text-align:center;padding:12px 0;">
            <div style="color:var(--green-700);margin-bottom:12px;">${ui.icon("check-circle", "xl")}</div>
            <h3 style="font-size:18px;color:var(--navy-900);margin-bottom:8px;">Verification Sent!</h3>
            <p style="font-size:14px;color:var(--c-text-secondary);margin-bottom:16px;">
              A 6-digit password reset code has been sent to <strong>${util.esc(val)}</strong> (Demo Simulation).
            </p>
            <div style="background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--r-md);padding:14px;font-size:13px;margin-bottom:20px;">
              <span>Simulated Verification Code:</span>
              <div style="font-size:24px;letter-spacing:4px;font-weight:800;color:var(--blue-700);margin-top:4px;">582914</div>
            </div>
            <a href="login.html" class="sbc-btn sbc-btn--primary sbc-btn--full">Return to Sign In</a>
          </div>
        `;
      });
    });
  </script>
</body>
</html>
